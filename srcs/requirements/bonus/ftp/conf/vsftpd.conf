# Run in the foreground as PID 1, IPv4 only
listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO

# Only the local FTP user may log in, and may write
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

# Locked inside the WordPress volume
local_root=/var/www/html
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

# Passive mode on a small published port range
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# Log transfers (docker exec ftp cat /var/log/vsftpd.log)
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=NO
vsftpd_log_file=/var/log/vsftpd.log
